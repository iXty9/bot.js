<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Discord Bot Manager - A web interface for managing Discord bots">
    <meta name="theme-color" content="hsl(var(--background))">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://discord.com https://*.discord.com ws://localhost:* wss://localhost:* http://localhost:* https://localhost:* ws: wss: http: https:; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' https://discord.com https://*.discord.com;">
    <title>Discord Bot Manager</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
    <style>
      :root {
        --background: 220 7.7% 7.5%;
        --foreground: 0 0% 100%;
        --card: 220 7.7% 11%;
        --card-foreground: 0 0% 100%;
        --popover: 220 7.7% 11%;
        --popover-foreground: 0 0% 100%;
        --primary: 235 85.6% 64.7%;
        --primary-foreground: 0 0% 100%;
        --secondary: 217.2 32.6% 17.5%;
        --secondary-foreground: 210 40% 98%;
        --muted: 217.2 32.6% 17.5%;
        --muted-foreground: 215 20.2% 65.1%;
        --accent: 217.2 32.6% 17.5%;
        --accent-foreground: 210 40% 98%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 210 40% 98%;
        --border: 217.2 32.6% 17.5%;
        --input: 217.2 32.6% 17.5%;
        --ring: 235 85.6% 64.7%;
        --radius: 0.5rem;
      }
        
        html {
            scroll-behavior: smooth;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: 'gg sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        *:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--primary));
        }
        textarea {
            resize: vertical;
            min-height: 80px;
            background-color: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
            border: 1px solid hsl(var(--border));
            border-radius: 0.375rem;
            padding: 0.75rem;
            width: 100%;
            margin-bottom: 1rem;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.5;
            transition: all 0.15s ease;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: hsl(var(--secondary)) transparent;
        }
        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        *::-webkit-scrollbar-track {
            background: transparent;
        }
        *::-webkit-scrollbar-thumb {
            background-color: hsl(var(--secondary));
            border-radius: 4px;
        }
        *::-webkit-scrollbar-thumb:hover {
            background-color: hsl(var(--secondary)/0.8);
        }
        
        /* Dropdown menu styles */
        select, .dropdown {
            background-color: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
            border: 1px solid hsl(var(--border));
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.5;
            transition: all 0.15s ease;
            appearance: auto;
            cursor: pointer;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        select:focus, .dropdown:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--primary)/0.5);
        }
        
        .dropdown-container {
            position: relative;
            width: 100%;
            margin-bottom: 1rem;
        }
        
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 10;
            background-color: hsl(var(--popover));
            border: 1px solid hsl(var(--border));
            border-radius: 0.375rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-height: 15rem;
            overflow-y: auto;
            margin-top: 0.25rem;
            display: block !important;
        }
        
        .dropdown-item {
            padding: 0.5rem 0.75rem;
            cursor: pointer;
        }
        
        .dropdown-item:hover {
            background-color: hsl(var(--secondary));
        }
        
        /* Fix for select elements */
        select option {
            background-color: hsl(var(--popover));
            color: hsl(var(--popover-foreground));
            padding: 0.5rem;
        }
        textarea:focus {
            outline: none;
            border-color: hsl(var(--primary));
            box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--primary)/0.5);
        }
        button {
            background-color: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
            padding: 0.75rem 1.25rem;
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 2.5rem;
            position: relative;
            overflow: hidden;
        }
        button::after {
            content: '';
            position: absolute;
            inset: 0;
            background-color: transparent;
            transition: background-color 0.15s ease;
        }
        button:hover::after {
            background-color: rgba(255, 255, 255, 0.1);
        }
        button:active::after {
            background-color: rgba(0, 0, 0, 0.1);
        }
        button:hover {
            background-color: hsl(var(--primary) / 0.8);
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background-color: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
            cursor: not-allowed;
            transform: none;
        }
        .error {
            background-color: hsl(var(--destructive)/0.15);
            color: hsl(var(--destructive));
            border: 1px solid hsl(var(--destructive)/0.2);
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="root" style="width: 100%; height: 100vh; overflow: auto;"></div>
    
    <!-- Simple Channel Selector -->
    <div id="simple-channel-selector" style="position: fixed; top: 20px; right: 20px; width: 300px; background-color: hsl(var(--card)); border-radius: 0.5rem; padding: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); z-index: 1000;">
        <h3 style="margin-top: 0; margin-bottom: 1rem; font-size: 1.25rem; font-weight: 600;">Simple Channel Selector</h3>
        
        <div style="margin-bottom: 1rem;">
            <label for="simple-channel-dropdown" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Select Channel:</label>
            <select id="simple-channel-dropdown" style="width: 100%;">
                <option value="">Loading channels...</option>
            </select>
        </div>
        
        <div style="margin-bottom: 1rem;">
            <label for="simple-message-input" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Message:</label>
            <textarea id="simple-message-input" placeholder="Type your message here..."></textarea>
        </div>
        
        <button id="simple-send-button" disabled>Send Message</button>
        
        <div id="simple-status" style="margin-top: 1rem; font-size: 0.875rem;"></div>
    </div>
    
    <noscript>
        <div style="text-align: center; padding: 2rem;">
            <h1>JavaScript Required</h1>
            <p>Please enable JavaScript to use the Discord Bot Manager.</p>
        </div>
    </noscript>
    <script src="/bundle.js"></script>
    <script>
        // Helper function to ensure dropdowns work properly
        document.addEventListener('DOMContentLoaded', function() {
            // Monitor DOM changes to ensure dropdowns are properly styled
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.addedNodes && mutation.addedNodes.length > 0) {
                        // Check for select elements and ensure they're visible
                        mutation.addedNodes.forEach(function(node) {
                            if (node.tagName === 'SELECT') {
                                ensureSelectVisible(node);
                            } else if (node.querySelectorAll) {
                                const selects = node.querySelectorAll('select');
                                selects.forEach(ensureSelectVisible);
                            }
                        });
                    }
                });
            });
            
            // Start observing the document with the configured parameters
            observer.observe(document.body, { childList: true, subtree: true });
            
            // Function to ensure select elements are visible
            function ensureSelectVisible(select) {
                if (select) {
                    select.style.display = 'block';
                    select.style.visibility = 'visible';
                    select.style.opacity = '1';
                    
                    // Ensure parent containers are also visible
                    let parent = select.parentElement;
                    while (parent && parent !== document.body) {
                        if (getComputedStyle(parent).display === 'none') {
                            parent.style.display = 'block';
                        }
                        if (getComputedStyle(parent).visibility === 'hidden') {
                            parent.style.visibility = 'visible';
                        }
                        if (getComputedStyle(parent).opacity === '0') {
                            parent.style.opacity = '1';
                        }
                        parent = parent.parentElement;
                    }
                }
            }
            
            // Apply to any existing selects
            const existingSelects = document.querySelectorAll('select');
            existingSelects.forEach(ensureSelectVisible);
        });

        // Simple Channel Selector Implementation
        document.addEventListener('DOMContentLoaded', function() {
            const channelDropdown = document.getElementById('simple-channel-dropdown');
            const messageInput = document.getElementById('simple-message-input');
            const sendButton = document.getElementById('simple-send-button');
            const statusElement = document.getElementById('simple-status');
            
            let selectedChannelId = null;
            let apiKey = localStorage.getItem('api_key') || '';
            
            // Function to update status
            function updateStatus(message, isError = false) {
                statusElement.textContent = message;
                statusElement.style.color = isError ? 'hsl(var(--destructive))' : 'hsl(var(--foreground))';
            }
            
            // Function to fetch channels
            async function fetchChannels() {
                try {
                    updateStatus('Fetching channels...');
                    
                    // Log the API key (masked for security)
                    console.log('Using API key:', apiKey ? '****' + apiKey.slice(-4) : 'none');
                    
                    const response = await fetch('/api/channels', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        }
                    });
                    
                    console.log('Response status:', response.status);
                    
                    if (!response.ok) {
                        throw new Error(`Failed to fetch channels: ${response.status} ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    // Clear loading option
                    channelDropdown.innerHTML = '';
                    
                    // Add default option
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = '-- Select a channel --';
                    channelDropdown.appendChild(defaultOption);
                    
                    // Add channel options
                    // Ensure we have an array of channels
                    const channels = Array.isArray(data) ? data : 
                                    (data.channels ? data.channels : []);
                    
                    console.log('Channels data:', channels);
                    
                    if (channels.length === 0) {
                        updateStatus('No channels found', true);
                        return;
                    }
                    
                    channels.forEach(channel => {
                        const option = document.createElement('option');
                        option.value = channel.id;
                        option.textContent = `${channel.name} (${channel.guildName || 'Unknown'}) - ${channel.type || 'text'}`;
                        channelDropdown.appendChild(option);
                    });
                    
                    updateStatus(`Loaded ${channels.length} channels`);
                } catch (error) {
                    console.error('Error fetching channels:', error);
                    updateStatus(`Error: ${error.message}`, true);
                }
            }
            
            // Function to send message
            async function sendMessage() {
                if (!selectedChannelId) {
                    updateStatus('Please select a channel first', true);
                    return;
                }
                
                const message = messageInput.value.trim();
                if (!message) {
                    updateStatus('Please enter a message', true);
                    return;
                }
                
                try {
                    updateStatus('Sending message...');
                    sendButton.disabled = true;
                    
                    const response = await fetch('/api/send', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            channelId: selectedChannelId,
                            message: message
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Failed to send message: ${response.status} ${response.statusText}`);
                    }
                    
                    const result = await response.json();
                    updateStatus('Message sent successfully!');
                    messageInput.value = '';
                } catch (error) {
                    console.error('Error sending message:', error);
                    updateStatus(`Error: ${error.message}`, true);
                } finally {
                    sendButton.disabled = false;
                }
            }
            
            // Event listeners
            channelDropdown.addEventListener('change', function() {
                selectedChannelId = this.value;
                sendButton.disabled = !selectedChannelId;
                
                if (selectedChannelId) {
                    updateStatus(`Selected channel: ${this.options[this.selectedIndex].text}`);
                } else {
                    updateStatus('No channel selected');
                }
            });
            
            sendButton.addEventListener('click', sendMessage);
            
            messageInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });
            
            // Initialize
            fetchChannels();
            
            // Add debug info
            console.log('Simple channel selector initialized');
            console.log('API key present:', !!apiKey);
            
            // Add refresh button
            const refreshButton = document.createElement('button');
            refreshButton.textContent = 'Refresh Channels';
            refreshButton.style.marginTop = '0.5rem';
            refreshButton.style.marginRight = '0.5rem';
            refreshButton.style.padding = '0.5rem 0.75rem';
            refreshButton.style.fontSize = '0.875rem';
            
            refreshButton.addEventListener('click', fetchChannels);
            
            // Add toggle button to show/hide the selector
            const toggleButton = document.createElement('button');
            toggleButton.textContent = 'Hide Selector';
            toggleButton.style.marginTop = '0.5rem';
            toggleButton.style.padding = '0.5rem 0.75rem';
            toggleButton.style.fontSize = '0.875rem';
            
            const selectorDiv = document.getElementById('simple-channel-selector');
            let isVisible = true;
            
            toggleButton.addEventListener('click', function() {
                if (isVisible) {
                    selectorDiv.style.height = '40px';
                    selectorDiv.style.overflow = 'hidden';
                    this.textContent = 'Show Selector';
                } else {
                    selectorDiv.style.height = 'auto';
                    selectorDiv.style.overflow = 'visible';
                    this.textContent = 'Hide Selector';
                }
                isVisible = !isVisible;
            });
            
            // Add buttons to the selector
            const buttonContainer = document.createElement('div');
            buttonContainer.style.display = 'flex';
            buttonContainer.style.justifyContent = 'space-between';
            
            buttonContainer.appendChild(refreshButton);
            buttonContainer.appendChild(toggleButton);
            
            statusElement.parentNode.insertBefore(buttonContainer, statusElement);
        });
    </script>
</body>
</html>
