<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Discord Bot Manager</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="description" content="Web interface for managing your Discord bot">
    <!-- Prevent caching during development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <div id="app">
        <!-- React will render here -->
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>Loading Discord Bot Manager...</p>
        </div>
    </div>

    <div id="offline-notification" class="hidden">
        You are currently offline. Some features may not work properly.
    </div>

    <div id="auth-error" class="hidden">
        Authentication failed. Please check your credentials and try again.
    </div>

    <noscript>
        <div class="noscript-warning">
            This application requires JavaScript to be enabled in your browser.
        </div>
    </noscript>

    <!-- Main application bundle -->
    <script src="/bundle.js"></script>
</body>
</html>
