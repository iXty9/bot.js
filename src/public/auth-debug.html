<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debugger</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .result { background: #f5f5f5; padding: 10px; border-radius: 4px; margin-top: 10px; }
        button { padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        input { padding: 8px; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Authentication Debugger</h1>
        <p>This tool helps debug authentication issues with the Discord bot API.</p>
        
        <h2>Health Check (No Auth Required)</h2>
        <button id="healthCheck">Check API Health</button>
        <div id="healthResult" class="result"></div>
        
        <h2>Test Authentication</h2>
        <p>Enter your Discord token to test authentication:</p>
        <input type="password" id="tokenInput" placeholder="Discord Token">
        <button id="testAuth">Test Authentication</button>
        <div id="authResult" class="result"></div>
        
        <h2>Environment Check</h2>
        <button id="envCheck">Check Environment</button>
        <div id="envResult" class="result"></div>
        <h2>Token Debugging</h2>
        <p>This will help diagnose token format issues:</p>
        <button id="debugToken">Debug Token Format</button>
        <div id="tokenDebugResult" class="result"></div>
    </div>

    <script>
        // Token debugging function
        document.getElementById('debugToken').addEventListener('click', () => {
            try {
                const token = document.getElementById('tokenInput').value;
                if (!token) {
                    document.getElementById('tokenDebugResult').innerText = 'Please enter a token first';
                    return;
                }
                
                const tokenInfo = {
                    length: token.length,
                    hasWhitespace: /\s/.test(token),
                    startsWithBot: token.startsWith('Bot '),
                    startsWithBearer: token.startsWith('Bearer '),
                    format: token.includes('.') ? 'Appears to be JWT format' : 'Not in JWT format',
                    firstFiveChars: token.substring(0, 5),
                    lastFiveChars: token.substring(token.length - 5)
                };
                
                // Create a properly formatted token for testing
                const cleanToken = token.trim().replace(/^(Bot|Bearer)\s+/i, '');
                const properBearerFormat = `Bearer ${cleanToken}`;
                
                document.getElementById('tokenDebugResult').innerText = 
                    `Token Analysis:\n${JSON.stringify(tokenInfo, null, 2)}\n\n` +
                    `Recommended format for testing:\n${properBearerFormat}`;
                
                // Update the token input with the properly formatted token
                document.getElementById('tokenInput').value = cleanToken;
            } catch (error) {
                document.getElementById('tokenDebugResult').innerText = `Error analyzing token: ${error.message}`;
            }
        });
        document.getElementById('healthCheck').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                document.getElementById('healthResult').innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('healthResult').innerText = `Error: ${error.message}`;
            }
        });

        document.getElementById('testAuth').addEventListener('click', async () => {
            try {
                const token = document.getElementById('tokenInput').value;
                document.getElementById('authResult').innerText = 'Testing authentication...';
                
                const response = await fetch('/api/status', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'same-origin'
                });
                
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    if (response.ok) {
                        document.getElementById('authResult').innerText = `Authentication successful!\n${JSON.stringify(data, null, 2)}`;
                    } else {
                        document.getElementById('authResult').innerText = `Authentication failed: ${data.error || 'Unknown error'}`;
                    }
                } else {
                    const text = await response.text();
                    document.getElementById('authResult').innerText = `Received non-JSON response: ${text.substring(0, 100)}${text.length > 100 ? '...' : ''}`;
                }
            } catch (error) {
                document.getElementById('authResult').innerText = `Error: ${error.message}\nMake sure the API server is running and accessible.`;
                console.error('Authentication test error:', error);
            }
        });

        document.getElementById('envCheck').addEventListener('click', async () => {
            try {
                const token = document.getElementById('tokenInput').value;
                document.getElementById('envResult').innerText = 'Checking environment...';
                
                const response = await fetch('/api/env', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'same-origin'
                });
                
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    if (response.ok) {
                        // Mask the token for security
                        if (data.DISCORD_TOKEN) {
                            data.DISCORD_TOKEN = data.DISCORD_TOKEN.substring(0, 5) + '...' + 
                                                (data.DISCORD_TOKEN.length > 10 ? 
                                                 data.DISCORD_TOKEN.substring(data.DISCORD_TOKEN.length - 5) : '');
                        }
                        document.getElementById('envResult').innerText = JSON.stringify(data, null, 2);
                    } else {
                        document.getElementById('envResult').innerText = `Failed: ${data.error || 'Unknown error'}`;
                    }
                } else {
                    const text = await response.text();
                    document.getElementById('envResult').innerText = `Received non-JSON response: ${text.substring(0, 100)}${text.length > 100 ? '...' : ''}`;
                }
            } catch (error) {
                document.getElementById('envResult').innerText = `Error: ${error.message}\nMake sure the API server is running and accessible.`;
                console.error('Environment check error:', error);
            }
        });
    </script>
</body>
</html>
